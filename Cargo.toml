[package]
name = "csw"
version = "0.1.0"
edition = "2021"
description = "Claude account switcher — swap Claude Code + Desktop accounts on macOS"

[[bin]]
name = "csw"
path = "src/main.rs"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha1 = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }

[dev-dependencies]
cbc = { version = "0.1", features = [] }
tempfile = "3"
