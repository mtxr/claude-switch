name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"

      - name: Build (debug)
        run: zig build

      - name: Build (release)
        run: zig build -Doptimize=ReleaseSmall

      - name: Test
        run: zig build test

      - name: Cross-compile Linux aarch64
        if: runner.os == 'Linux'
        run: zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSmall
