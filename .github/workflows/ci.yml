name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build (debug)
        run: zig build

      - name: Build (release)
        run: zig build -Doptimize=ReleaseSmall

      - name: Test
        run: zig build test
