name: Nix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix:
    name: Nix build & check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Build the prebuilt package
        run: nix build --print-build-logs

      - name: Build from source
        run: nix build .#csw-src --print-build-logs

      - name: Flake check
        run: nix flake check --print-build-logs

      - name: Upload resolved flake.lock
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: warn
