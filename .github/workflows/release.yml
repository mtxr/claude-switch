name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-macos
            arch: aarch64
          - target: x86_64-macos
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build
        run: |
          zig build \
            -Doptimize=ReleaseSmall \
            -Dtarget=${{ matrix.target }}
          strip zig-out/bin/csw
          cp zig-out/bin/csw csw-${{ matrix.arch }}-macos

      - uses: actions/upload-artifact@v4
        with:
          name: csw-${{ matrix.arch }}-macos
          path: csw-${{ matrix.arch }}-macos

  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            csw-aarch64-macos \
            csw-x86_64-macos \
            --repo ${{ github.repository }}
