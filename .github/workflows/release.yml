name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build
        run: |
          zig build \
            -Doptimize=ReleaseSmall \
            -Dtarget=${{ matrix.target }}
          strip zig-out/bin/csw
          cp zig-out/bin/csw csw-${{ matrix.arch }}-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: csw-${{ matrix.arch }}-apple-darwin
          path: csw-${{ matrix.arch }}-apple-darwin

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            csw-aarch64-apple-darwin
            csw-x86_64-apple-darwin
