name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            asset: csw-aarch64-apple-darwin
          - runner: macos-15-intel
            asset: csw-x86_64-apple-darwin
          - runner: ubuntu-latest
            asset: csw-x86_64-unknown-linux-musl
            target: x86_64-linux-musl
          - runner: ubuntu-latest
            asset: csw-aarch64-unknown-linux-musl
            target: aarch64-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            zig build -Doptimize=ReleaseSmall -Dtarget=${{ matrix.target }}
          else
            zig build -Doptimize=ReleaseSmall
            strip zig-out/bin/csw
          fi

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp zig-out/bin/csw "zig-out/bin/${{ matrix.asset }}"
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            "zig-out/bin/${{ matrix.asset }}" \
            --repo ${{ github.repository }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: zig-out/bin/${{ matrix.asset }}

  checksums:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Generate SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download ${{ needs.release-please.outputs.tag_name }} \
            --repo ${{ github.repository }} \
            --pattern 'csw-*' \
            --dir assets
          cd assets
          sha256sum csw-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            assets/SHA256SUMS \
            --repo ${{ github.repository }} \
            --clobber

      - name: Attest SHA256SUMS
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: assets/SHA256SUMS
