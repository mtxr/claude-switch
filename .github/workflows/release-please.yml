name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            asset: csw-aarch64-apple-darwin
          - runner: macos-13
            asset: csw-x86_64-apple-darwin
          - runner: ubuntu-latest
            asset: csw-x86_64-unknown-linux-musl
            target: x86_64-linux-musl
          - runner: ubuntu-latest
            asset: csw-aarch64-unknown-linux-musl
            target: aarch64-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            zig build -Doptimize=ReleaseSmall -Dtarget=${{ matrix.target }}
          else
            zig build -Doptimize=ReleaseSmall
            strip zig-out/bin/csw
          fi

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp zig-out/bin/csw "zig-out/bin/${{ matrix.asset }}"
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            "zig-out/bin/${{ matrix.asset }}" \
            --repo ${{ github.repository }}
